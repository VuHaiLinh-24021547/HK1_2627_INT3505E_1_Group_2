openapi: 3.0.3
info:
  title: Book Management API
  description: Quản lý hệ thống sách
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000
    description: Main Server 

security:
  - bearerAuth: []

paths:
  /books:
    get:
      summary: Lấy danh sách toàn bộ sách
      security:
        - bearerAuth: []
      operationId: getBooks
      responses:
        '200':
          $ref: '#/components/responses/GetBooksSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Thêm sách mới
      security:
        - bearerAuth: []
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookInput'
      responses:
        '201':
          $ref: '#/components/responses/PostSuccess'
        '400':
          $ref: '#/components/responses/MissingBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/FieldError'
  /books/{bookId}:
    parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: integer
          format: int64
        description: ID duy nhất của sách
    get:
      summary: Lấy thông tin một cuốn sách theo ID
      security:
        - bearerAuth: []
      operationId: getBookById
      responses:
        '200':
          $ref: '#/components/responses/GetBookSuccess'
        '304':
          description: "Not Modified"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Thay thế thông tin sách
      security:
        - bearerAuth: []
      operationId: putBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBookInput'
      responses:
        '200':
          $ref: '#/components/responses/PutSuccess'
        '400':
          $ref: '#/components/responses/MissingBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/FieldError'
    patch:
      summary: Cập nhật một phần thông tin sách
      security:
        - bearerAuth: []
      operationId: patchBook
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookInput'
      responses:
        '200':
          $ref: '#/components/responses/PatchSuccess'
        '400':
          $ref: '#/components/responses/MissingBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/FieldError'
    delete:
      summary: Xóa sách
      security:
        - bearerAuth: []
      operationId: deleteBook
      responses:
        '204': 
          description: Xóa sách thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http 
      scheme: bearer 
      bearerFormat: JWT
  responses:
    'GetBooksSuccess':
      description: Lấy danh sách sách thành công
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Book'
    'GetBookSuccess':
      description: Lấy thông tin sách thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Book'
    'PatchSuccess':
      description: Sửa thông tin sách thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Book'
    'PostSuccess':
      description: Thêm sách thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Book'
    'PutSuccess':
      description: Thay thế thông tin sách thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Book'
    'NotFound':
      description: Không tìm thấy sách
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    'Unauthorized':
      description: Chưa xác thực quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError' 
    'Forbidden':
      description: Người dùng không có quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    'MissingBody':
      description: Người dùng chưa nhập body
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/MissingBodyError'
    'FieldError':
      description: Người dùng vi phạm quy tắc của trường dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldError'
  schemas:
    Book:
      type: object
      required:
        - id 
        - title 
        - author 
        - price 
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title: 
          type: string
          example: "Clean Code"
        author:
          type: string
          example: "Robert C. Martin"
        price:
          type: integer
          format: int64 
          minimum: 0
          example: 100000
    UpdateBookInput:
      type: object
      properties:
        title: 
          type: string
          example: "Clean Code"
          nullable: true
        author:
          type: string
          example: "Robert C. Martin"
          nullable: true
        price:
          type: integer
          format: int64
          minimum: 0
          description: "Giá sách tính bằng VNĐ"
          example: 100000
    CreateBookInput:
      type: object
      required:
        - title
        - author
        - price
      properties:
        title:
          type: string
          example: "Clean Code"
        author:
          type: string
          example: "Robert C. Martin"
        price:
          type: integer
          format: int64
          minimum: 0
          description: "Giá sách tính bằng VNĐ"
          example: 100000
    ReplaceBookInput:
      type: object
      required:
        - title
        - author
        - price
      properties:
        title:
          type: string
          example: "Clean Code"
        author:
          type: string
          example: "Robert C. Martin"
        price:
          type: integer
          format: int64
          minimum: 0
          description: "Giá sách tính bằng VNĐ"
          example: 100000
    NotFoundError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          enum: [404]
        message: 
          type: string
          example: "book not found"
    UnauthorizedError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          enum: [401]
        message:
          type: string 
          example: "unauthorized user"
    ForbiddenError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          enum: [403]
        message:
          type: string
          example: "forbidden user"
    MissingBodyError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: string
          example: "Thiếu body"
    FieldError:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          enum: [422]
        message:
          type: string
          example: "Price phải lớn hơn 0"
